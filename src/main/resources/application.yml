binance:
  apiKey: YOUR_BINANCE_API_KEY
  apiSecret: YOUR_BINANCE_API_SECRET
telegram:
  botToken: YOUR_TELEGRAM_BOT_TOKEN
  chatId: YOUR_TELEGRAM_CHAT_ID # Optional: if you want to send to a specific chat
strategy:
  symbols: BTCUSDT,ETHUSDT,SOLUSDT # Comma-separated list of symbols
  defaultTimeframe: 15m
  confirmationTimeframes: 5m,1h
  tradingHours:
    start: "02:00" # UTC
    end: "23:00"   # UTC
  rsiPeriod: 14
  emaShortPeriod: 9
  emaLongPeriod: 21
  bollingerPeriod: 20
  bollingerStdDev: 2.0 # Ensure this is treated as double
  volumeAvgPeriod: 10
  longExitTarget1Percent: 1.5
  longStopLossPercent: 1.2
  shortExitTarget1Percent: 1.5
  shortStopLossPercent: 1.2
  fixedUsdAmountPerTrade: 100.0 # Fixed USD amount for position sizing
# Cron expression for the scheduler, can be overridden by environment variable or command line
# Default is every 15 minutes (at 0, 15, 30, 45 minutes past the hour)
# Example: "0 0/15 * * * ?"
# Example: "0 * * * * ?" (every minute for testing)
# trading.scheduler.cron: "0 0/15 * * * ?" # This is a placeholder for where it would be if not using default
# The actual default is set in TradingBotScheduler.java @Scheduled annotation
# To override, set an environment variable TRADING_SCHEDULER_CRON or pass as command line arg
# --trading.scheduler.cron="0 * * * * ?"
# Or define it here if you want it as the primary source:
# scheduler:
#   cron: "0 0/15 * * * ?" # This would then be accessed via @Value("${scheduler.cron}") or another Config class
# For TradingBotScheduler's @Scheduled, if we want this file to be the source for the default,
# it should be like:
# scheduler:
#   cron: "0 0/15 * * * ?"
# And TradingBotScheduler would reference it as @Scheduled(cron = "${scheduler.cron}")
# The current setup in TradingBotScheduler is @Scheduled(cron = "${trading.scheduler.cron:0 0/15 * * * ?}")
# So, to use this file, we'd define:
# trading:
#   scheduler:
#     cron: "0 0/1 * * * ?" # Example: every minute
# For now, I'll add the property under 'strategy' as it's related to trading operation timing.
  scheduler:
    cron: "0 0/15 * * * ?" # Default cron for scheduler
